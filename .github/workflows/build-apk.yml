name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q GenshinHubAndroid_phone_build.zip -d extracted

          if [ -d extracted/GenshinHubAndroid ]; then
            cp -R extracted/GenshinHubAndroid/. ./
          else
            cp -R extracted/. ./
          fi

      - name: Configure Android Java 17
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("*.gradle.kts")) + list(Path(".").rglob("*.gradle"))

          for path in files:
              if ".git" in path.parts:
                  continue

              text = path.read_text()

              # Remove old Java 8 configuration if present
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  'sourceCompatibility = JavaVersion.VERSION_1_8',
                  'sourceCompatibility = JavaVersion.VERSION_17'
              )

              text = text.replace(
                  'targetCompatibility = JavaVersion.VERSION_1_8',
                  'targetCompatibility = JavaVersion.VERSION_17'
              )

              # Add explicit Android Java 17 compile options
              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
                  if "android {" in text:
                      text = text.replace(
                          "android {",
                          """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          """,
                          1
                      )

              path.write_text(text)

              print(f"Configured: {path}")
          PY

          echo "=== Checking Java/Kotlin configuration ==="

          grep -R -n -E \
            "compileOptions|sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            . || true

      - name: Configure compileSdk 36
        shell: bash
        run: |
          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' {} +

          echo "=== compileSdk ==="

          grep -R -n \
            "compileSdk" \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            . || true

      - name: Configure Kotlin JVM 17
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          for path in list(Path(".").rglob("*.gradle.kts")) + list(Path(".").rglob("*.gradle")):
              if ".git" in path.parts:
                  continue

              text = path.read_text()

              text = text.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

              text = text.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )

              path.write_text(text)
          PY

      - name: Check Android project
        run: |
          echo "=== Project ==="
          ls -la

          echo "=== App ==="
          ls -la app

          echo "=== Gradle files ==="
          find . -maxdepth 4 -name "*.gradle*" -type f -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          echo "=== Generated APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
