name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل ملفات المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. فك ضغط مشروع Android
      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q GenshinHubAndroid_phone_build.zip -d extracted

          echo "Files inside ZIP:"
          find extracted -maxdepth 3 -type f | head -100

          # نسخ محتويات المشروع إلى جذر المستودع
          cp -R extracted/. ./

      # 3. التأكد من وجود مشروع Android
      - name: Check Android project
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "App directory:"
          ls -la app

      # 4. إعداد Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. تثبيت Android SDK
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      # 7. تثبيت Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 8. بناء APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 9. التأكد من إنشاء APK
      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs -type f -name "*.apk" -print

      # 10. رفع APK كملف يمكن تحميله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
