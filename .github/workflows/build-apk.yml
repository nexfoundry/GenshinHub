name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q GenshinHubAndroid_phone_build.zip -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          cp -R extracted/GenshinHubAndroid/. ./

      - name: Check Android project
        run: |
          echo "Project files:"
          ls -la
          echo "App directory:"
          ls -la app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
