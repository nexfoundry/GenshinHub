name: Build Genshin HUB APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Extract Android project
      # =========================================================
      - name: Extract Android project
        run: |
          set -e

          echo "================================"
          echo "REPOSITORY"
          echo "================================"

          ls -la

          echo ""
          echo "Looking for Android project ZIP..."

          if [ ! -f "GenshinHubAndroid_UI_v2.zip" ]; then
            echo "ERROR: GenshinHubAndroid_UI_v2.zip was not found."
            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found GenshinHubAndroid_UI_v2.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "GenshinHubAndroid_UI_v2.zip" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          # Handle nested or root project structure
          if [ -d "extracted/GenshinHubAndroid" ]; then
            echo ""
            echo "Nested Android project detected."
            cp -R extracted/GenshinHubAndroid/. ./
          else
            echo ""
            echo "Project files are at ZIP root."
            cp -R extracted/. ./
          fi


      # =========================================================
      # 3. Verify Android project
      # =========================================================
      - name: Verify Android project
        run: |
          set -e

          echo "================================"
          echo "ANDROID PROJECT"
          echo "================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App directory:"

          if [ -d "app" ]; then
            ls -la app
          else
            echo "ERROR: app directory was not found."
            exit 1
          fi

          echo ""
          echo "Gradle files:"
          find . -maxdepth 5 \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -type f \
            -print

          echo ""
          echo "AndroidManifest:"
          find app -name "AndroidManifest.xml" -print

          echo ""
          echo "Gradle wrapper:"
          find . -maxdepth 4 \
            \( \
              -name "gradlew" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle was not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: app/build.gradle.kts or app/build.gradle was not found."
            exit 1
          fi

          echo ""
          echo "Android project verification completed successfully."


      # =========================================================
      # 4. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 5. Setup Android SDK
      #
      # IMPORTANT:
      # packages: '' prevents the action from trying to install
      # the obsolete "tools" package.
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"


      # =========================================================
      # 6. Install required Android SDK packages
      # =========================================================
      - name: Install Android SDK 36
        run: |
          set -e

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo ""
          echo "SDK root:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Installing platform-tools..."
          sdkmanager "platform-tools"

          echo ""
          echo "Installing Android 36 platform..."
          sdkmanager "platforms;android-36"

          echo ""
          echo "Installing Build Tools 36.0.0..."
          sdkmanager "build-tools;36.0.0"

          echo ""
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null || true

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed || true

          echo ""
          echo "Android SDK setup completed successfully."


      # =========================================================
      # 7. Setup Gradle
      # =========================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      # =========================================================
      # 8. Verify Java, Android SDK and Gradle
      # =========================================================
      - name: Verify build environment
        run: |
          set -e

          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          which sdkmanager
          sdkmanager --version

          echo ""
          echo "================================"
          echo "GRADLE"
          echo "================================"

          gradle --version


      # =========================================================
      # 9. Create Debug Keystore
      # =========================================================
      - name: Create Debug Keystore
        run: |
          set -e

          echo "================================"
          echo "DEBUG KEYSTORE"
          echo "================================"

          if [ -f "debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          fi

          echo ""
          echo "Keystore:"
          ls -lh debug.keystore


      # =========================================================
      # 10. Make Gradle wrapper executable if present
      # =========================================================
      - name: Prepare Gradle wrapper
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "No Gradle wrapper found."
            echo "Using installed Gradle version."
          fi


      # =========================================================
      # 11. Build Debug APK
      # =========================================================
      - name: Build Debug APK
        run: |
          set -e

          echo "================================"
          echo "BUILDING GENSHIN HUB APK"
          echo "================================"

          if [ -f "./gradlew" ]; then

            echo "Building with Gradle Wrapper..."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              :app:assembleDebug

          else

            echo "Building with installed Gradle..."

            gradle \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              :app:assembleDebug

          fi


      # =========================================================
      # 12. Check APK
      # =========================================================
      - name: Check APK
        run: |
          set -e

          echo "================================"
          echo "GENERATED APK FILES"
          echo "================================"

          echo ""
          echo "Searching for APK files..."

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then

            echo ""
            echo "ERROR: app-debug.apk was not generated."

            echo ""
            echo "Available build outputs:"
            find app/build/outputs \
              -type f \
              -print || true

            exit 1

          fi

          echo ""
          echo "================================"
          echo "APK SUCCESSFULLY GENERATED"
          echo "================================"

          ls -lh "$APK_PATH"

          echo ""
          echo "APK path:"
          echo "$APK_PATH"


      # =========================================================
      # 13. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
