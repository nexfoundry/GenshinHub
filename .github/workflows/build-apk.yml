name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q GenshinHubAndroid_phone_build.zip -d extracted

          cp -R extracted/GenshinHubAndroid/. ./

      - name: Fix Android configuration
        run: |
          echo "=== Original configuration ==="
          grep -R -n -E "compileSdk|sourceCompatibility|targetCompatibility|jvmTarget" \
            app/*.gradle* 2>/dev/null || true

          # AndroidX Core 1.17 requires compileSdk 36+
          find app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' {} \;

          # Force Java 17 instead of Java 8
          find app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' {} \;

          # Force Kotlin JVM target 17
          find app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i -E \
            's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' {} \;

          echo "=== Fixed configuration ==="
          grep -R -n -E "compileSdk|sourceCompatibility|targetCompatibility|jvmTarget" \
            app/*.gradle* 2>/dev/null || true

      - name: Check Android project
        run: |
          echo "=== Project ==="
          ls -la

          echo "=== App ==="
          ls -la app

          echo "=== Gradle files ==="
          find . -maxdepth 3 -name "*.gradle*" -type f -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          echo "=== Generated APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
