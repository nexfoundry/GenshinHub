name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q GenshinHubAndroid_phone_build.zip -d extracted

          # دعم الحالتين:
          # 1. المشروع داخل GenshinHubAndroid
          # 2. المشروع موجود مباشرة داخل ZIP
          if [ -d extracted/GenshinHubAndroid ]; then
            cp -R extracted/GenshinHubAndroid/. ./
          else
            cp -R extracted/. ./
          fi

      - name: Fix Android configuration
        shell: bash
        run: |
          echo "=== Original configuration ==="

          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec grep -nH -E \
            "compileSdk|sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8" {} + || true

          echo "=== Applying fixes ==="

          # compileSdk 36
          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' {} +

          # Java 8 -> Java 17
          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec sed -i -E \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' {} +

          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec sed -i -E \
            's/(sourceCompatibility|targetCompatibility)[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/\1 = "17"/g' {} +

          # Kotlin JVM 1.8 -> 17
          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec sed -i -E \
            's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' {} +

          echo "=== Final configuration ==="

          find . -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -not -path "./.git/*" \
            -exec grep -nH -E \
            "compileSdk|sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8" {} + || true

      - name: Check Android project
        run: |
          echo "=== Project ==="
          ls -la

          echo "=== App ==="
          ls -la app

          echo "=== Gradle files ==="
          find . -maxdepth 4 -name "*.gradle*" -type f -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          echo "=== Generated APK ==="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
