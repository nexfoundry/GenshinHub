name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q GenshinHubAndroid_phone_build.zip -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 4 -type f | sort

          # Copy Android project to repository root
          cp -R extracted/GenshinHubAndroid/. ./

      - name: Fix compileSdk
        run: |
          echo "Before:"
          grep -R "compileSdk" -n app build.gradle.kts 2>/dev/null || true

          # AndroidX Core 1.17 requires compileSdk 36+
          find app -name "*.gradle" -o -name "*.gradle.kts" | while read file; do
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' "$file"
          done

          echo "After:"
          grep -R "compileSdk" -n app build.gradle.kts 2>/dev/null || true

      - name: Check Android project
        run: |
          echo "Project root:"
          ls -la

          echo "App:"
          ls -la app

          echo "Gradle files:"
          find . -maxdepth 3 -name "*.gradle*" -type f -print

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          echo "Generated APK:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
