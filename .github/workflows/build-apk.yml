name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. استخراج مشروع Android من ملف ZIP
      - name: Extract Android project
        run: |
          set -e

          echo "=== Repository files ==="
          ls -la

          echo "=== Looking for project ZIP ==="
          if [ ! -f "GenshinHubAndroid_UI_v2.zip" ]; then
            echo "ERROR: GenshinHubAndroid_UI_v2.zip was not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found GenshinHubAndroid_UI_v2.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "GenshinHubAndroid_UI_v2.zip" -d extracted

          echo "=== Extracted files ==="
          find extracted -maxdepth 3 -type f | head -100

          # Handle both possible ZIP structures:
          # extracted/GenshinHubAndroid/...
          # OR extracted/app/...
          if [ -d "extracted/GenshinHubAndroid" ]; then
            echo "Nested project detected."
            cp -R extracted/GenshinHubAndroid/. ./
          else
            echo "Project files are at ZIP root."
            cp -R extracted/. ./
          fi

      # 3. التأكد من إعداد Java 17
      - name: Configure Android Java 17
        run: |
          set -e

          find app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' {} \;

          echo "Java compatibility configuration:"
          grep -R -n -E "sourceCompatibility|targetCompatibility" \
            app/*.gradle* 2>/dev/null || true

      # 4. ضبط compileSdk إلى 36
      - name: Configure compileSdk 36
        run: |
          set -e

          find app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*35/compileSdk = 36/g' {} \;

          echo "compileSdk configuration:"
          grep -R -n "compileSdk" \
            app/*.gradle* 2>/dev/null || true

      # 5. ضبط Kotlin JVM إلى 17
      - name: Configure Kotlin JVM 17
        run: |
          set -e

          find app -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i -E \
            's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' {} \;

          echo "Kotlin JVM configuration:"
          grep -R -n "jvmTarget" \
            app/*.gradle* 2>/dev/null || true

      # 6. فحص المشروع
      - name: Verify Android project
        run: |
          set -e

          echo "================================"
          echo "ANDROID PROJECT"
          echo "================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

          echo ""
          echo "Gradle files:"
          find . -maxdepth 4 \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
            -type f -print

          echo ""
          echo "AndroidManifest:"
          find app -name "AndroidManifest.xml" -print

          echo ""
          echo "Gradle wrapper:"
          find . -maxdepth 3 \
            \( -name "gradlew" -o -name "gradle-wrapper.properties" \) \
            -print

          if [ ! -d "app" ]; then
            echo "ERROR: app directory was not found."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

      # 7. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 8. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 9. تثبيت Android SDK 36
      - name: Install Android SDK 36
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      # 10. Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # 11. التحقق من Java وGradle
      - name: Verify Java and Gradle
        run: |
          set -e

          echo "================================"
          echo "JAVA"
          echo "================================"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "================================"
          echo "GRADLE"
          echo "================================"
          gradle --version

      # 12. بناء APK
      - name: Build Debug APK
        run: |
          set -e

          echo "================================"
          echo "BUILDING GENSHIN HUB APK"
          echo "================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      # 13. التأكد من إنشاء APK
      - name: Check APK
        run: |
          set -e

          echo "================================"
          echo "GENERATED APK FILES"
          echo "================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 14. رفع APK إلى Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
