name: Build Genshin HUB APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. استخراج مشروع Android من ملف ZIP
      - name: Extract Android project
        run: |
          set -e

          echo "================================"
          echo "REPOSITORY"
          echo "================================"

          ls -la

          echo ""
          echo "Looking for Android project ZIP..."

          if [ ! -f "GenshinHubAndroid_UI_v2.zip" ]; then
            echo "ERROR: GenshinHubAndroid_UI_v2.zip was not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found GenshinHubAndroid_UI_v2.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "GenshinHubAndroid_UI_v2.zip" -d extracted

          echo ""
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          # Handle both possible ZIP structures
          if [ -d "extracted/GenshinHubAndroid" ]; then
            echo ""
            echo "Nested project detected."
            cp -R extracted/GenshinHubAndroid/. ./
          else
            echo ""
            echo "Project files are at ZIP root."
            cp -R extracted/. ./
          fi

      # 3. التحقق من وجود مشروع Android
      - name: Verify Android project
        run: |
          set -e

          echo "================================"
          echo "ANDROID PROJECT"
          echo "================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App directory:"
          if [ -d "app" ]; then
            ls -la app
          else
            echo "ERROR: app directory was not found."
            exit 1
          fi

          echo ""
          echo "Gradle files:"
          find . -maxdepth 5 \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) \
            -type f -print

          echo ""
          echo "AndroidManifest:"
          find app -name "AndroidManifest.xml" -print

          echo ""
          echo "Gradle wrapper:"
          find . -maxdepth 4 \
            \( -name "gradlew" -o -name "gradle-wrapper.properties" \) \
            -print

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle was not found."
            exit 1
          fi

      # 4. إعداد Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. إعداد Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. تثبيت Android SDK 36
      - name: Install Android SDK 36
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      # 7. إعداد Gradle 9.3.1
      #
      # AGP 9.1.1 يحتاج Gradle 9.3.1 أو أحدث.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 8. التحقق من Java و Gradle
      - name: Verify Java and Gradle
        run: |
          set -e

          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "================================"
          echo "GRADLE"
          echo "================================"

          gradle --version

      # 9. إنشاء Android Debug Keystore
      #
      # المشروع يستخدم debug.keystore مخصصًا في rootDir.
      # GitHub Actions لا يحتوي عليه افتراضيًا، لذلك ننشئه أثناء البناء.
      - name: Create Debug Keystore
        run: |
          set -e

          echo "================================"
          echo "DEBUG KEYSTORE"
          echo "================================"

          if [ -f "debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            echo "debug.keystore created successfully."
          fi

          echo ""
          echo "Keystore:"
          ls -lh debug.keystore

      # 10. بناء APK
      - name: Build Debug APK
        run: |
          set -e

          echo "================================"
          echo "BUILDING GENSHIN HUB APK"
          echo "================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      # 11. التأكد من إنشاء APK
      - name: Check APK
        run: |
          set -e

          echo "================================"
          echo "GENERATED APK FILES"
          echo "================================"

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo ""
            echo "ERROR: app-debug.apk was not generated."

            echo ""
            echo "Available build outputs:"
            find app/build/outputs -type f -print || true

            exit 1
          fi

          echo ""
          echo "APK successfully generated."

          ls -lh "$APK_PATH"

      # 12. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenshinHub-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
